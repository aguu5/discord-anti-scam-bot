# Copy this file to config.yaml and fill in your values:
#   cp config.example.yaml config.yaml
#
# Never commit config.yaml to a public repository: it contains the bot token.

token: "YOUR_TOKEN_HERE"

prefix: "!"

# ID of a specific server for instant command syncing during development.
# null means global sync; a server ID means instant sync to that server only.
# Switching from guild-scoped back to global later leaves duplicate commands
# in that server until the guild copies are cleared.
sync_guild_id: null

# Path to the SQLite database for runtime state.
db_path: "data/bot_state.db"

# ID of the channel where the bot will post alerts with evidence.
# (Enable "Developer Mode" in Discord -> right-click the channel -> Copy ID)
#
# --- Per-Guild Settings ---
#
# NOTE: The following settings were migrated from the global config to the 
# per-guild database settings. They should now be managed using the 
# /scamconfig set command (and other /scamconfig commands like add_exempt_role)
# per server, rather than in this file. 
#
# If you include them here, they will be IGNORED.
# 
# Managed via /scamconfig:
# - mod_log_channel_id
# - quarantine_role_id
# - action_threshold
# - alert_threshold
# - hamming_threshold
# - new_account_days_threshold
# - burst_message_count
# - burst_window_seconds
